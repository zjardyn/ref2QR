<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin - Ref2QR{% endblock %}</title>
    <style>
        body { 
            font-family: sans-serif; 
            background-color: #f0f0f0; /* Slightly different background for admin if desired */
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .content {
            max-width: 900px; /* Admin pages might want more width */
            margin: 2em auto; 
            background-color: white;
            padding: 2em;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        h1, h2 { color: #333; }
        .flash-messages {
            padding: 1em;
            margin-bottom: 1em;
        }
        .flash-message {
            padding: 0.75em;
            margin-bottom: 0.5em;
            border-radius: 4px;
            border: 1px solid transparent;
        }
        .flash-error {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }
        .flash-success {
            background-color: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }
        .flash-info { /* For general informational messages */
            background-color: #e2e3e5;
            color: #383d41;
            border-color: #d6d8db;
        }
        /* Add any other minimal styles needed for admin pages here */
    </style>
</head>
<body>
    <div class="content">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                    {# Default to 'info' if category is not error or success #}
                    <div class="flash-message flash-{{ category if category in ['error', 'success'] else 'info' }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
